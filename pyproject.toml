[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fresnelkml"
version = "0.1.0"
description = "Generate Google Earth Pro KML showing the Fresnel zone between two radio sites, as a CLI, library and FastCGI web service."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["requests>=2.20"]
geodesy = ["pyproj>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
fresnel_kml = "fresnelkml.cli:main"

[tool.setuptools]
packages = ["fresnelkml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
