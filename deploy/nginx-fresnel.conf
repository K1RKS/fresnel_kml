# Fresnel KML service: add these blocks inside your NGINX `server { ... }`.
# The tree lives at $document_root/site (e.g. /var/www/html/site) and is served at /site/.
# If you install it under another name, change "/site/" below to match.
#
# Optional rate limit (put this line in the http { } block, e.g. /etc/nginx/conf.d/fresnel.conf):
#   limit_req_zone $binary_remote_addr zone=fresnel:1m rate=10r/m;

# The page loads lib/fresnelkml/*.py into Pyodide, so this path must be served as static
# files. Do not deny it. Nginx 1.21 and later already map .wasm to application/wasm.

location = /site/api/fresnel.cgi {
    # limit_req zone=fresnel burst=5 nodelay;
    client_max_body_size 16k;
    fastcgi_read_timeout 60s;
    gzip on;
    gzip_types application/json application/vnd.google-earth.kml+xml;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # fastcgi_param FRESNEL_CONFIG /etc/fresnelkml/config.json;
    # fastcgi_param GOOGLE_ELEVATION_KEY "your-key";
    # fcgiwrap holds back output until it has 8 KB; this makes it pass the page's progress lines on at once
    fastcgi_param NO_BUFFERING 1;
    fastcgi_pass unix:/run/fcgiwrap.socket;
}

